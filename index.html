<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KwanHo">
<link rel="apple-touch-icon" href="app-icon.jpg">
<link rel="manifest" href="manifest.json">
<title>KwanHo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>

:root {
  --bg: #08080f;
  --card: #12122a;
  --card-hover: #1a1a3a;
  --border: #2a1a35;
  --primary: #ff4582;
  --primary-light: #ff6b9d;
  --primary-glow: rgba(255,69,130,0.15);
  --accent: #ffb3d0;
  --accent-warm: #ffcc80;
  --text: #f0e6ff;
  --text-dim: #7a6e8a;
  --text-muted: #4a3e5a;
  --success: #5eeadb;
  --danger: #ff4d6a;
  --warning: #ffb347;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 20px var(--primary-glow);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(255,69,130,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(255,69,130,0.04) 0%, transparent 50%);
  color:var(--text);
  min-height:100vh;
  padding-top: calc(env(safe-area-inset-top) + 24px);
  padding-left: calc(env(safe-area-inset-left) + 24px);
  padding-right: calc(env(safe-area-inset-right) + 24px);
  padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
}

.container { max-width:1260px; margin:0 auto; }

/* Header */
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:16px; }
.header-brand { display:flex; align-items:center; gap:14px; }
.logo-icon {
  width:46px; height:46px;
  background:linear-gradient(135deg,#ff4582,#ff1a66);
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 24px rgba(255,69,130,0.4);
}
.logo-icon svg { width:24px; height:24px; }
.header-title h1 {
  font-size:22px; font-weight:800;
  background:linear-gradient(135deg,#ff8aaf,#ff4582,#ffb3d0);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  letter-spacing:-0.5px;
}
.header-title .subtitle { font-size:12px; color:var(--text-dim); margin-top:2px; font-weight:500; }
.header-actions { display:flex; gap:10px; }

.btn {
  background:var(--card); border:1px solid var(--border);
  color:var(--text); padding:9px 16px; border-radius:10px;
  cursor:pointer; font-size:13px; font-weight:500;
  transition:all 0.2s; display:inline-flex; align-items:center; gap:7px;
  font-family:inherit; white-space:nowrap;
}
.btn:hover { background:var(--card-hover); border-color:var(--primary); }
.btn svg { width:15px; height:15px; flex-shrink:0; }
.btn-primary { background:linear-gradient(135deg,#ff4582,#e03a6f); border-color:transparent; color:#fff; font-weight:600; }
.btn-primary:hover { background:linear-gradient(135deg,#ff5c93,#ff4582); box-shadow:var(--shadow-glow); }
.btn-ghost { background:transparent; border-color:transparent; }
.btn-ghost:hover { background:rgba(255,69,130,0.1); }

/* Stats */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px; }
.stat-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:18px; padding:16px 18px; transition:all 0.25s;
  position:relative; overflow:hidden;
}
.stat-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--primary),transparent);
  opacity:0; transition:opacity 0.3s;
}
.stat-card:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:var(--shadow),var(--shadow-glow); }
.stat-card:hover::before { opacity:1; }

.stat-icon {
  width:34px; height:34px; border-radius:10px;
  display:flex; align-items:center; justify-content:center; margin-bottom:8px;
}
.stat-icon svg { width:17px; height:17px; }
.si-pink { background:rgba(255,69,130,0.15); }
.si-purple { background:rgba(180,130,255,0.15); }
.si-gold { background:rgba(255,179,80,0.15); }
.si-cyan { background:rgba(94,234,219,0.15); }
.si-red { background:rgba(255,77,106,0.15); }

.stat-label { font-size:11px; color:var(--text-dim); margin-bottom:5px; font-weight:600; letter-spacing:0.3px; text-transform:uppercase; }
.stat-value {
  font-size:30px; font-weight:800; line-height:1;
  background:linear-gradient(135deg,#fff,#ffb3d0);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.stat-value.good { background:linear-gradient(135deg,#5eeadb,#8fffe6); -webkit-background-clip:text; background-clip:text; }
.stat-value.bad { background:linear-gradient(135deg,#ff4d6a,#ff8a9e); -webkit-background-clip:text; background-clip:text; }
.stat-value .unit { font-size:12px; font-weight:500; opacity:0.5; }
.stat-extra { font-size:11px; color:var(--text-muted); margin-top:3px; }

/* Main Grid */
.main-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
@media(max-width:860px){ .main-grid{grid-template-columns:1fr;} }

.panel {
  background:var(--card); border:1px solid var(--border);
  border-radius:22px; padding:22px; box-shadow:var(--shadow);
  transition:border-color 0.3s;
}
.panel:hover { border-color:rgba(255,69,130,0.2); }
.panel-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.panel-header svg { width:19px; height:19px; flex-shrink:0; }
.panel-header h2 { font-size:15px; font-weight:700; letter-spacing:-0.2px; }

/* Calendar */
.cal-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.cal-month { font-size:15px; font-weight:700; }
.cal-nav { display:flex; gap:4px; }
.cal-nav button {
  background:var(--bg); border:1px solid var(--border); color:var(--text);
  width:30px; height:30px; border-radius:8px; cursor:pointer;
  font-size:14px; font-weight:600; transition:all 0.2s;
  display:flex; align-items:center; justify-content:center;
}
.cal-nav button:hover { border-color:var(--primary); background:var(--card-hover); }
.cal-nav .btn-today { font-size:11px; font-weight:700; width:auto; padding:0 9px; }

.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-weekday { text-align:center; font-size:10px; color:var(--text-muted); padding:2px 0; font-weight:600; }
.cal-day {
  aspect-ratio:1; background:var(--bg); border:1px solid transparent;
  border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; transition:all 0.15s; position:relative; font-size:12px; font-weight:500;
  min-height:38px; color:var(--text-dim);
}
.cal-day:hover { border-color:var(--primary); background:var(--card-hover); }
.cal-day.other { opacity:0.2; pointer-events:none; }
.cal-day.today { border-color:var(--primary-light); background:rgba(255,69,130,0.08); color:#fff; font-weight:700; }
.cal-day.today::after { content:''; position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--primary); }
.cal-day.has-doi { border-color:rgba(255,69,130,0.5); background:linear-gradient(135deg,rgba(255,69,130,0.25),rgba(255,26,102,0.1)); color:#fff; font-weight:600; }
.cal-day .day-emoji { position:absolute; top:1px; right:3px; font-size:9px; }
.cal-day .day-badge { font-size:9px; color:var(--accent-warm); font-weight:700; position:absolute; bottom:1px; }

/* Charts */
.chart-wrap { position:relative; height:210px; }

/* Score Board */
.score-board {
  background:var(--card); border:1px solid var(--border);
  border-radius:22px; padding:22px; box-shadow:var(--shadow); margin-bottom:18px;
}
.score-board:hover { border-color:rgba(255,69,130,0.3); }
.score-main { display:grid; grid-template-columns:220px 1fr 220px; gap:20px; align-items:center; }
@media(max-width:900px){ .score-main{grid-template-columns:1fr;} }

.score-left { text-align:center; }
.score-big-label { font-size:11px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
.score-number { font-size:64px; font-weight:900; line-height:1; letter-spacing:-3px; }
.score-number.high { background:linear-gradient(135deg,#5eeadb,#b8fff0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.score-number.mid { background:linear-gradient(135deg,#ffb347,#ffcc80); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.score-number.low { background:linear-gradient(135deg,#ff4d6a,#ffb3c0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.score-sub { font-size:12px; color:var(--text-dim); margin-top:2px; }
.score-center .chart-wrap { height:170px; }

.score-right { display:flex; flex-direction:column; gap:10px; }
.score-change-row { display:flex; align-items:center; justify-content:center; gap:8px; }
.score-change { font-size:15px; font-weight:700; display:flex; align-items:center; gap:4px; }
.score-change.up { color:var(--success); }
.score-change.down { color:var(--danger); }
.score-change-label { font-size:11px; color:var(--text-dim); }

.quick-btns { display:flex; gap:10px; justify-content:center; }
.quick-btn {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:14px 16px; border-radius:16px; cursor:pointer;
  border:2px dashed; background:transparent; transition:all 0.2s;
  font-family:inherit; min-width:80px;
}
.quick-btn.plus { border-color:var(--success); color:var(--success); }
.quick-btn.plus:hover { background:rgba(94,234,219,0.08); border-style:solid; box-shadow:0 0 20px rgba(94,234,219,0.2); }
.quick-btn.minus { border-color:var(--danger); color:var(--danger); }
.quick-btn.minus:hover { background:rgba(255,77,106,0.08); border-style:solid; box-shadow:0 0 20px rgba(255,77,106,0.2); }
.quick-btn .qb-icon { font-size:26px; font-weight:800; }
.quick-btn .qb-label { font-size:11px; font-weight:600; }

/* Month Compare */
.month-compare { display:flex; align-items:flex-end; gap:8px; height:120px; padding-top:8px; }
.month-bar { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.month-bar .bar {
  width:100%; background:linear-gradient(180deg,var(--primary-light),var(--primary));
  border-radius:6px 6px 0 0; transition:all 0.3s; min-height:4px;
}
.month-bar:hover .bar { background:linear-gradient(180deg,var(--accent),var(--primary-light)); box-shadow:0 0 10px var(--primary-glow); }
.month-bar .bar-label { font-size:10px; color:var(--text-dim); font-weight:500; }
.month-bar .bar-count { font-size:11px; color:var(--primary-light); font-weight:700; }

/* Recent */
.recent-list { max-height:220px; overflow-y:auto; }
.recent-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 8px; border-bottom:1px solid var(--border);
  cursor:pointer; border-radius:8px; transition:background 0.15s; gap:8px;
}
.recent-item:last-child { border-bottom:none; }
.recent-item:hover { background:var(--card-hover); }
.recent-item .r-date { font-size:12px; font-weight:600; min-width:65px; }
.recent-item .r-meta { font-size:11px; color:var(--text-dim); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.recent-item .r-score-plus { color:var(--success); font-weight:700; }
.recent-item .r-score-minus { color:var(--danger); font-weight:700; }
.recent-item .r-rating { color:var(--accent-warm); letter-spacing:1px; }
.empty-state { text-align:center; padding:40px 0; color:var(--text-dim); font-size:13px; line-height:1.8; }

/* Score Log */
.score-log { max-height:300px; overflow-y:auto; }
.score-log-item {
  display:flex; align-items:center; gap:12px; padding:10px 8px;
  border-bottom:1px solid var(--border); border-radius:8px; transition:background 0.15s;
}
.score-log-item:last-child { border-bottom:none; }
.score-log-item:hover { background:var(--card-hover); }
.score-log-icon {
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:800; flex-shrink:0;
}
.score-log-icon.add { background:rgba(94,234,219,0.12); color:var(--success); }
.score-log-icon.sub { background:rgba(255,77,106,0.12); color:var(--danger); }
.score-log-info { flex:1; min-width:0; }
.score-log-reason { font-size:13px; font-weight:500; }
.score-log-date { font-size:10px; color:var(--text-muted); margin-top:1px; }
.score-log-points { font-size:15px; font-weight:800; flex-shrink:0; }
.score-log-points.add { color:var(--success); }
.score-log-points.sub { color:var(--danger); }

/* Modal */
.modal-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.65); backdrop-filter:blur(6px);
  z-index:100; justify-content:center; align-items:center; padding:20px;
}
.modal-overlay.show { display:flex; }

.modal {
  background:var(--card); border:1px solid var(--border);
  border-radius:22px; padding:26px 24px; width:100%; max-width:460px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 40px var(--primary-glow);
  animation:modalIn 0.25s ease; max-height:90vh; overflow-y:auto;
}
@keyframes modalIn { from{opacity:0;transform:scale(0.95) translateY(10px);} to{opacity:1;transform:scale(1) translateY(0);} }

.modal h3 { font-size:17px; font-weight:700; color:var(--primary-light); margin-bottom:2px; }
.modal .modal-date { font-size:12px; color:var(--text-dim); margin-bottom:18px; }

.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:11px; color:var(--text-dim); margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }

.counter-group { display:flex; align-items:center; gap:14px; }
.counter-group button {
  width:36px; height:36px; border-radius:50%;
  background:var(--bg); border:2px solid var(--border);
  color:var(--primary-light); font-size:18px; font-weight:700;
  cursor:pointer; transition:all 0.2s;
  display:flex; align-items:center; justify-content:center;
}
.counter-group button:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
.counter-group .count-display { font-size:24px; font-weight:800; color:var(--primary-light); min-width:28px; text-align:center; }

.rating-group { display:flex; gap:5px; font-size:22px; }
.rating-group span { cursor:pointer; opacity:0.25; transition:all 0.15s; }
.rating-group span.active { opacity:1; }
.rating-group span:hover { opacity:0.7; transform:scale(1.15); }

.score-input-group { display:flex; align-items:center; gap:10px; }
.score-input-group input {
  flex:1; background:var(--bg); border:1px solid var(--border);
  color:var(--text); padding:10px 12px; border-radius:10px;
  font-size:14px; font-family:inherit; text-align:center; font-weight:700;
}
.score-input-group input:focus { outline:none; border-color:var(--primary); }
.score-input-group .sign-label { font-size:14px; font-weight:700; min-width:20px; text-align:center; }

.form-group textarea, .form-group input[type="text"] {
  width:100%; background:var(--bg); border:1px solid var(--border);
  color:var(--text); padding:10px 12px; border-radius:10px;
  font-size:13px; font-family:inherit; resize:vertical;
}
.form-group textarea { min-height:56px; }
.form-group input[type="text"]:focus, .form-group textarea:focus { outline:none; border-color:var(--primary); }

.modal-actions { display:flex; gap:10px; margin-top:20px; }
.modal-actions .btn { flex:1; justify-content:center; padding:11px; font-size:14px; }
.btn-danger { border-color:rgba(255,77,106,0.4); color:var(--danger); background:transparent; }
.btn-danger:hover { background:rgba(255,77,106,0.15); }

/* Tabs */
.tabs { display:flex; gap:4px; margin-bottom:18px; background:var(--bg); border-radius:12px; padding:4px; }
.tab-btn {
  flex:1; padding:10px; border:none; border-radius:10px; cursor:pointer;
  background:transparent; color:var(--text-dim); font-size:13px; font-weight:600;
  font-family:inherit; transition:all 0.2s;
}
.tab-btn.active { background:var(--card); color:var(--primary-light); box-shadow:0 2px 8px rgba(0,0,0,0.3); }
.tab-btn:hover:not(.active) { color:var(--text); }

.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* Scrollbar */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }
::-webkit-scrollbar-thumb:hover { background:var(--primary); }

.footer-note {
  text-align:center; color:var(--text-muted); font-size:11px;
  margin-top:24px; padding:16px; display:flex; align-items:center;
  justify-content:center; gap:6px;
}
.footer-note svg { width:14px; height:14px; opacity:0.5; }

.badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:10px; font-weight:700; }
.badge-green { background:rgba(94,234,219,0.15); color:var(--success); }
.badge-red { background:rgba(255,77,106,0.15); color:var(--danger); }
.badge-pink { background:rgba(255,69,130,0.15); color:var(--primary-light); }

/* ========== Lock Screen ========== */
.lock-screen {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 25%, rgba(255,69,130,0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 85%, rgba(255,69,130,0.04) 0%, transparent 50%);
  display: flex; flex-direction: column; align-items: center;
  padding: 24px;
  overflow: hidden;
}

.lock-header {
  margin-top: 12vh;
  text-align: center;
  animation: fadeUp 0.6s ease;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

.lock-icon-wrap {
  width: 56px; height: 56px;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, #ff4582, #ff1a66);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 28px rgba(255,69,130,0.4);
}
.lock-icon-wrap svg { width: 24px; height: 24px; }

.lock-title {
  font-size: 26px; font-weight: 900; letter-spacing: -0.5px;
  background: linear-gradient(135deg, #ff8aaf, #ff4582, #ffb3d0);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 4px;
}
.lock-sub {
  font-size: 13px; color: var(--text-dim); font-weight: 500; margin-bottom: 0;
  min-height: 20px; transition: all 0.3s;
}

/* 密码圆点 */
.dots-row {
  display: flex; gap: 16px; justify-content: center;
  margin: 40px 0 48px;
}
.dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid rgba(255,69,130,0.4);
  transition: all 0.2s;
}
.dot.filled { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 10px rgba(255,69,130,0.5); }
.dot.error {
  background: var(--danger); border-color: var(--danger);
  box-shadow: 0 0 10px rgba(255,77,106,0.5);
  animation: shake 0.5s ease;
}

/* 数字键盘 */
.num-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px 28px;
  max-width: 280px;
  width: 100%;
  margin-top: auto;
  margin-bottom: 8vh;
  padding-bottom: 20px;
}
.num-key {
  width: 72px; height: 72px; border-radius: 50%;
  border: 1px solid rgba(255,69,130,0.15);
  background: rgba(255,69,130,0.04);
  color: var(--text);
  font-size: 26px; font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.num-key:hover { background: rgba(255,69,130,0.12); border-color: rgba(255,69,130,0.4); }
.num-key:active {
  background: rgba(255,69,130,0.25);
  border-color: var(--primary);
  transform: scale(0.92);
  box-shadow: 0 0 20px var(--primary-glow);
}
.num-key.placeholder { border-color: transparent; background: transparent; cursor: default; }
.num-key.placeholder:hover, .num-key.placeholder:active { background: transparent; transform: none; box-shadow: none; }
.num-key.delete {
  border-color: transparent; background: transparent;
  font-size: 14px; color: var(--text-dim);
}
.num-key.delete:hover { background: rgba(255,77,106,0.1); border-color: rgba(255,77,106,0.3); color: var(--danger); }
.num-key.delete:active { background: rgba(255,77,106,0.2); transform: scale(0.92); box-shadow: none; }

.lock-footer {
  position: absolute; bottom: 24px;
  font-size: 10px; color: var(--text-muted);
}

/* Section divider */
.section-label {
  font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase;
  letter-spacing:0.8px; margin-bottom:12px; padding-left:4px;
}
</style>

<script>
// ============================================================
// 数据层
// ============================================================
const DOI_KEY = 'intimate_doi_v2';
const SCORE_KEY = 'intimate_score_v2';

let doiRecords = {};       // { 'YYYY-MM-DD': { count, rating, note } }
let scoreLogs = [];        // [{ date, type:'add'|'sub', points, reason, time }]
let currentScore = 100;    // 当前总分
let currentMonth = new Date();
let editingDate = null;
let editingCount = 1;
let editingRating = 0;
let trendChart = null;
let scoreChart = null;
let scoreMode = 'add';     // 'add' | 'sub'

function loadData() {
  try {
    const raw = localStorage.getItem(DOI_KEY);
    if (raw) doiRecords = JSON.parse(raw);
  } catch(e) { doiRecords = {}; }
  try {
    const raw = localStorage.getItem(SCORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      scoreLogs = data.logs || [];
      currentScore = data.currentScore || 100;
    }
  } catch(e) { scoreLogs = []; currentScore = 100; }
}

function saveDoiData() { localStorage.setItem(DOI_KEY, JSON.stringify(doiRecords)); }
function saveScoreData() { localStorage.setItem(SCORE_KEY, JSON.stringify({ logs: scoreLogs, currentScore })); }

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ============================================================
// Tab 切换
// ============================================================
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'doi') renderDoiAll();
  if (name === 'score') renderScoreAll();
}

// ============================================================
// DOI 日历
// ============================================================
function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('calMonthLabel').textContent = `${year}年${month+1}月`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevMonthLast = new Date(year, month, 0).getDate();

  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  ['日','一','二','三','四','五','六'].forEach(w => {
    const el = document.createElement('div');
    el.className = 'cal-weekday';
    el.textContent = w;
    grid.appendChild(el);
  });

  for (let i = startWeekday-1; i >= 0; i--) {
    const d = document.createElement('div');
    d.className = 'cal-day other';
    d.textContent = prevMonthLast - i;
    grid.appendChild(d);
  }

  const today = new Date();
  const todayKey = dateKey(today);

  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const key = dateKey(d);
    const el = document.createElement('div');
    el.className = 'cal-day';
    if (key === todayKey) el.classList.add('today');
    if (doiRecords[key]) {
      el.classList.add('has-doi');
      el.innerHTML = `<span class="day-emoji">💗</span>${day}<span class="day-badge">×${doiRecords[key].count}</span>`;
    } else {
      el.textContent = day;
    }
    el.onclick = () => openDoiModal(d);
    grid.appendChild(el);
  }

  const totalCells = startWeekday + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    const d = document.createElement('div');
    d.className = 'cal-day other';
    d.textContent = i;
    grid.appendChild(d);
  }
}

function changeMonth(delta) {
  currentMonth.setMonth(currentMonth.getMonth() + delta);
  renderCalendar();
}
function goToday() { currentMonth = new Date(); renderCalendar(); }

// ============================================================
// DOI 弹窗
// ============================================================
function openDoiModal(date) {
  editingDate = dateKey(date);
  document.getElementById('doiModalDate').textContent = `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`;
  const rec = doiRecords[editingDate];
  if (rec) {
    editingCount = rec.count;
    editingRating = rec.rating || 0;
    document.getElementById('doiNoteInput').value = rec.note || '';
    document.getElementById('doiDeleteBtn').style.display = '';
  } else {
    editingCount = 1;
    editingRating = 0;
    document.getElementById('doiNoteInput').value = '';
    document.getElementById('doiDeleteBtn').style.display = 'none';
  }
  updateDoiCountDisplay();
  updateRatingDisplay();
  document.getElementById('doiModalOverlay').classList.add('show');
}

function closeDoiModal(event) {
  if (event && event.target !== document.getElementById('doiModalOverlay')) return;
  document.getElementById('doiModalOverlay').classList.remove('show');
}

function changeDoiCount(delta) {
  editingCount = Math.max(1, editingCount + delta);
  updateDoiCountDisplay();
}
function updateDoiCountDisplay() { document.getElementById('doiCountDisplay').textContent = editingCount; }

function setRating(n) { editingRating = n; updateRatingDisplay(); }
function updateRatingDisplay() {
  const spans = document.getElementById('ratingGroup').children;
  for (let i = 0; i < spans.length; i++) spans[i].classList.toggle('active', i < editingRating);
}

function saveDoiRecord() {
  doiRecords[editingDate] = {
    count: editingCount,
    rating: editingRating,
    note: document.getElementById('doiNoteInput').value.trim()
  };
  saveDoiData();
  document.getElementById('doiModalOverlay').classList.remove('show');
  renderDoiAll();
}

function deleteDoiRecord() {
  if (!confirm('确定删除这条 DOI 记录吗？')) return;
  delete doiRecords[editingDate];
  saveDoiData();
  document.getElementById('doiModalOverlay').classList.remove('show');
  renderDoiAll();
}

// ============================================================
// DOI 统计
// ============================================================
function renderDoiStats() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();

  let monthCount = 0, monthDays = 0;
  Object.entries(doiRecords).forEach(([key, rec]) => {
    const [y, m] = key.split('-').map(Number);
    if (y === year && m === month+1) { monthCount += rec.count; monthDays++; }
  });
  const dayOfMonth = now.getDate();
  document.getElementById('statMonthCount').innerHTML = `${monthCount}<span class="unit">次</span>`;
  document.getElementById('statMonthExtra').textContent = `本月已过 ${dayOfMonth} 天 · ${monthDays} 天有记录`;

  let totalCount = 0, totalDays = 0;
  Object.values(doiRecords).forEach(rec => { totalCount += rec.count; totalDays++; });
  document.getElementById('statTotalCount').innerHTML = `${totalCount}<span class="unit">次</span>`;
  document.getElementById('statTotalExtra').textContent = `共 ${totalDays} 天有记录`;

  const streak = calcStreak();
  const maxStreak = calcMaxStreak();
  document.getElementById('statStreak').innerHTML = `${streak}<span class="unit">天</span>`;
  document.getElementById('statStreakExtra').textContent = `最长连续 ${maxStreak} 天`;

  let ratingSum = 0, ratingCount = 0;
  Object.values(doiRecords).forEach(rec => { if (rec.rating > 0) { ratingSum += rec.rating; ratingCount++; } });
  if (ratingCount > 0) {
    document.getElementById('statAvgRating').innerHTML = `${(ratingSum/ratingCount).toFixed(1)}<span class="unit">/5</span>`;
  } else {
    document.getElementById('statAvgRating').textContent = '—';
  }
  document.getElementById('statAvgExtra').textContent = `基于 ${ratingCount} 次评分`;
}

function calcStreak() {
  const today = new Date();
  let streak = 0;
  let d = new Date(today);
  if (!doiRecords[dateKey(d)]) d.setDate(d.getDate()-1);
  while (doiRecords[dateKey(d)]) { streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function calcMaxStreak() {
  const keys = Object.keys(doiRecords).sort();
  if (keys.length === 0) return 0;
  let max = 1, cur = 1;
  for (let i = 1; i < keys.length; i++) {
    const diff = (new Date(keys[i]) - new Date(keys[i-1])) / 86400000;
    if (diff === 1) { cur++; max = Math.max(max, cur); }
    else { cur = 1; }
  }
  return max;
}

// ============================================================
// DOI 图表
// ============================================================
function renderTrendChart() {
  const labels = [], data = [];
  const today = new Date();
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = dateKey(d);
    labels.push(`${d.getMonth()+1}/${d.getDate()}`);
    data.push(doiRecords[key] ? doiRecords[key].count : 0);
  }
  const ctx = document.getElementById('trendChart').getContext('2d');
  if (trendChart) trendChart.destroy();
  const gradient = ctx.createLinearGradient(0, 0, 0, 210);
  gradient.addColorStop(0, 'rgba(255,69,130,0.35)');
  gradient.addColorStop(1, 'rgba(255,69,130,0)');
  trendChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data,
        borderColor: '#ff4582',
        backgroundColor: gradient,
        fill: true,
        tension: 0.4,
        pointRadius: data.map(v => v>0?4:0),
        pointBackgroundColor: '#ffcc80',
        pointBorderColor: '#ff4582',
        pointBorderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor: '#12122a', borderColor: '#ff4582', borderWidth: 1, callbacks: { label: ctx => `${ctx.parsed.y} 次` } } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a6e8a', font: { size: 9 }, maxTicksLimit: 8 } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a6e8a', stepSize: 1 }, beginAtZero: true }
      }
    }
  });
}

function renderMonthCompare() {
  const container = document.getElementById('monthCompare');
  container.innerHTML = '';
  const now = new Date();
  const counts = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    let count = 0;
    Object.entries(doiRecords).forEach(([key, rec]) => {
      const [y, m] = key.split('-').map(Number);
      if (y === d.getFullYear() && m === d.getMonth()+1) count += rec.count;
    });
    counts.push({ count, d });
  }
  const maxCount = Math.max(1, ...counts.map(c => c.count));
  counts.forEach(({ count, d }) => {
    const bar = document.createElement('div');
    bar.className = 'month-bar';
    bar.innerHTML = `<div class="bar-count">${count}</div><div class="bar" style="height:${Math.max((count/maxCount)*100,3)}%"></div><div class="bar-label">${d.getMonth()+1}月</div>`;
    bar.onclick = () => { currentMonth = d; renderCalendar(); };
    container.appendChild(bar);
  });
}

function renderRecentList() {
  const list = document.getElementById('recentList');
  const sorted = Object.entries(doiRecords).sort((a,b) => b[0].localeCompare(a[0])).slice(0, 10);
  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty-state">还没有 DOI 记录<br>点击日历上的日期开始记录吧 ❤️‍🔥</div>';
    return;
  }
  const weekDays = ['日','一','二','三','四','五','六'];
  list.innerHTML = sorted.map(([key, rec]) => {
    const [y, m, d] = key.split('-').map(Number);
    const date = new Date(y, m-1, d);
    const rating = '❤️'.repeat(rec.rating || 0);
    return `<div class="recent-item" onclick="openDoiModal(new Date(${y},${m-1},${d}))"><div class="r-date">${m}月${d}日 周${weekDays[date.getDay()]}</div><div class="r-meta"><span>×${rec.count}</span>${rating?`<span class="r-rating">${rating}</span>`:''}${rec.note?`<span style="color:var(--text-muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${rec.note}</span>`:''}</div></div>`;
  }).join('');
}

// ============================================================
// 小本本分数
// ============================================================
function openScoreModal(mode) {
  scoreMode = mode;
  document.getElementById('scoreModalTitle').textContent = mode === 'add' ? '➕ 给男友加分' : '➖ 给男友减分';
  document.getElementById('scoreSign').textContent = mode === 'add' ? '+' : '−';
  document.getElementById('scoreValueInput').value = '5';
  document.getElementById('scoreReasonInput').value = '';
  document.getElementById('scoreModalOverlay').classList.add('show');
}

function closeScoreModal(event) {
  if (event && event.target !== document.getElementById('scoreModalOverlay')) return;
  document.getElementById('scoreModalOverlay').classList.remove('show');
}

function saveScore() {
  const points = parseInt(document.getElementById('scoreValueInput').value) || 0;
  const reason = document.getElementById('scoreReasonInput').value.trim();
  if (points <= 0) { alert('分值必须大于0'); return; }
  if (!reason) { alert('请填写加减分理由'); return; }

  const change = scoreMode === 'add' ? points : -points;
  currentScore += change;

  scoreLogs.push({
    date: dateKey(new Date()),
    time: new Date().toISOString(),
    type: scoreMode,
    points,
    reason
  });

  // 评分联动：如果当天有 DOI 记录且评分 ≥4，自动提示加分
  const todayKey = dateKey(new Date());
  const doiToday = doiRecords[todayKey];

  saveScoreData();
  document.getElementById('scoreModalOverlay').classList.remove('show');
  renderScoreAll();
}

function renderScoreBoard() {
  const numEl = document.getElementById('scoreBigNumber');
  numEl.textContent = currentScore;
  numEl.className = 'score-number';
  if (currentScore > 110) numEl.classList.add('high');
  else if (currentScore < 90) numEl.classList.add('low');
  else numEl.classList.add('mid');

  // 本月变化
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  let monthChange = 0;
  scoreLogs.forEach(log => {
    const [y, m] = log.date.split('-').map(Number);
    if (y === year && m === month) monthChange += log.type === 'add' ? log.points : -log.points;
  });

  const changeEl = document.getElementById('scoreMonthChange');
  if (monthChange > 0) {
    changeEl.innerHTML = `<span class="score-change up">↑ +${monthChange}</span>`;
  } else if (monthChange < 0) {
    changeEl.innerHTML = `<span class="score-change down">↓ ${monthChange}</span>`;
  } else {
    changeEl.textContent = '—';
  }
}

function renderScoreChart() {
  const labels = [], data = [];
  let runningScore = 100;
  const sorted = [...scoreLogs].sort((a,b) => new Date(a.time) - new Date(b.time));

  // 取最近60条
  const recent = sorted.slice(-60);
  if (recent.length === 0) {
    const today = new Date();
    labels.push(`${today.getMonth()+1}/${today.getDate()}`);
    data.push(100);
  } else {
    // 从初始分开始累积
    let score = 100;
    // 跳过显示之前的分数
    const allSorted = [...scoreLogs].sort((a,b) => new Date(a.time) - new Date(b.time));
    const startIdx = Math.max(0, allSorted.length - 60);
    for (let i = 0; i < startIdx; i++) {
      score += allSorted[i].type === 'add' ? allSorted[i].points : -allSorted[i].points;
    }
    for (let i = startIdx; i < allSorted.length; i++) {
      const log = allSorted[i];
      score += log.type === 'add' ? log.points : -log.points;
      const d = new Date(log.time);
      labels.push(`${d.getMonth()+1}/${d.getDate()}`);
      data.push(score);
    }
  }

  const ctx = document.getElementById('scoreChart').getContext('2d');
  if (scoreChart) scoreChart.destroy();

  const gradient = ctx.createLinearGradient(0, 0, 0, 170);
  gradient.addColorStop(0, 'rgba(94,234,219,0.3)');
  gradient.addColorStop(1, 'rgba(94,234,219,0)');

  const borderColor = currentScore >= 100 ? '#5eeadb' : '#ffb347';
  const pointColor = currentScore >= 100 ? '#5eeadb' : '#ff4d6a';

  scoreChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data,
        borderColor,
        backgroundColor: gradient,
        fill: true,
        tension: 0.3,
        pointRadius: 3,
        pointBackgroundColor: pointColor,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#12122a', borderColor: '#5eeadb', borderWidth: 1, callbacks: { label: ctx => `分数: ${ctx.parsed.y}` } },
        annotation: {
          annotations: {
            baseline: { type: 'line', yMin: 100, yMax: 100, borderColor: 'rgba(255,255,255,0.15)', borderWidth: 1, borderDash: [6,4] }
          }
        }
      },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a6e8a', font: { size: 9 }, maxTicksLimit: 8 } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a6e8a' } }
      }
    }
  });
}

function renderScoreLog() {
  const container = document.getElementById('scoreLog');
  const sorted = [...scoreLogs].sort((a,b) => new Date(b.time) - new Date(a.time));

  if (sorted.length === 0) {
    container.innerHTML = '<div class="empty-state">还没有分数变动记录<br>点击上方"加分"或"减分"按钮开始记录</div>';
    return;
  }

  container.innerHTML = sorted.map(log => {
    const [y, m, d] = log.date.split('-').map(Number);
    const sign = log.type === 'add' ? '+' : '−';
    const cls = log.type === 'add' ? 'add' : 'sub';
    const timeStr = `${m}月${d}日`;
    return `<div class="score-log-item">
      <div class="score-log-icon ${cls}">${sign}</div>
      <div class="score-log-info">
        <div class="score-log-reason">${log.reason}</div>
        <div class="score-log-date">${timeStr}</div>
      </div>
      <div class="score-log-points ${cls}">${sign}${log.points}</div>
    </div>`;
  }).join('');
}

// ============================================================
// 导入导出
// ============================================================
function exportData() {
  const data = {
    doiRecords,
    scoreLogs,
    currentScore,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workbench_backup_${dateKey(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (confirm('导入将合并到现有记录中，确定继续吗？')) {
        if (data.doiRecords) doiRecords = { ...doiRecords, ...data.doiRecords };
        if (data.scoreLogs) scoreLogs = [...scoreLogs, ...data.scoreLogs];
        if (data.currentScore !== undefined) currentScore = data.currentScore;
        saveDoiData();
        saveScoreData();
        renderAll();
        alert('导入成功！');
      }
    } catch(err) {
      alert('文件格式错误，导入失败');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============================================================
// 渲染入口
// ============================================================
function renderDoiAll() {
  renderCalendar();
  renderDoiStats();
  renderTrendChart();
  renderMonthCompare();
  renderRecentList();
}

function renderScoreAll() {
  renderScoreBoard();
  renderScoreChart();
  renderScoreLog();
}

function renderAll() {
  renderDoiAll();
  renderScoreAll();
}

// ============================================================
// 密码锁屏

const PASSWORD_KEY = 'kwanho_lock_password';
let storedPass = localStorage.getItem(PASSWORD_KEY);
if (storedPass) {
  if (storedPass === '' || storedPass === 'null' || storedPass === 'undefined' || !/^\d{4,6}$/.test(storedPass)) {
    localStorage.removeItem(PASSWORD_KEY);
    storedPass = null;
  }
}
if (!storedPass) {
  storedPass = '123456';
  localStorage.setItem(PASSWORD_KEY, '123456');
}
let lockPassword = storedPass;
let inputBuffer = '';
let targetDigits = lockPassword.length;

(function initDots() {
  const row = document.getElementById('dotsRow');
  row.innerHTML = '';
  for (let i = 0; i < targetDigits; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    row.appendChild(dot);
  }
})();

function pressKey(digit) {
  if (inputBuffer.length >= targetDigits) return;
  inputBuffer += digit;
  updateDots();
  if (inputBuffer.length === targetDigits) {
    setTimeout(() => checkPassword(), 150);
  }
}

function pressDelete() {
  if (inputBuffer.length === 0) return;
  inputBuffer = inputBuffer.slice(0, -1);
  updateDots();
  // 清除错误状态
  document.querySelectorAll('.dot').forEach(d => d.classList.remove('error'));
  document.getElementById('lockMsg').textContent = '输入密码';
  document.getElementById('lockMsg').style.color = '';
}

function updateDots() {
  const dots = document.querySelectorAll('#dotsRow .dot');
  dots.forEach((d, i) => {
    d.classList.toggle('filled', i < inputBuffer.length);
    d.classList.remove('error');
  });
}

function checkPassword() {
  const dots = document.querySelectorAll('#dotsRow .dot');
  const msg = document.getElementById('lockMsg');

  if (inputBuffer !== lockPassword) {
    // 错误
    dots.forEach(d => { d.classList.add('error'); d.classList.remove('filled'); });
    msg.textContent = '密码错误';
    msg.style.color = 'var(--danger)';

    // 抖动标题
    const header = document.querySelector('.lock-header');
    header.style.animation = 'none';
    header.offsetHeight;
    header.style.animation = 'shake 0.5s ease';

    // 1秒后重置
    setTimeout(() => {
      inputBuffer = '';
      dots.forEach(d => { d.classList.remove('error', 'filled'); });
      msg.textContent = '输入密码';
      msg.style.color = '';
    }, 800);
    return;
  }

  // 正确
  msg.textContent = '✓';
  msg.style.color = 'var(--success)';
  setTimeout(() => {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = '';
    inputBuffer = '';
    loadData();
    renderAll();
  }, 300);
}

function unlock() { /* 数字键盘不需要手动提交 */ }

// 修改密码
function changePassword(newPass) {
  if (!newPass || newPass.length < 4) {
    alert('密码至少4位');
    return false;
  }
  if (newPass.length > 6) {
    alert('密码最多6位');
    return false;
  }
  if (!/^\d+$/.test(newPass)) {
    alert('密码只能是数字');
    return false;
  }
  lockPassword = newPass;
  targetDigits = newPass.length;
  localStorage.setItem(PASSWORD_KEY, newPass);
  return true;
}

setTimeout(() => {

<script>

// ============================================================
// 数据层
// ============================================================
const DOI_KEY = 'intimate_doi_v2';
const SCORE_KEY = 'intimate_score_v2';

let doiRecords = {};       // { 'YYYY-MM-DD': { count, rating, note } }
let scoreLogs = [];        // [{ date, type:'add'|'sub', points, reason, time }]
let currentScore = 100;    // 当前总分
let currentMonth = new Date();
let editingDate = null;
let editingCount = 1;
let editingRating = 0;
let trendChart = null;
let scoreChart = null;
let scoreMode = 'add';     // 'add' | 'sub'

function loadData() {
  try {
    const raw = localStorage.getItem(DOI_KEY);
    if (raw) doiRecords = JSON.parse(raw);
  } catch(e) { doiRecords = {}; }
  try {
    const raw = localStorage.getItem(SCORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      scoreLogs = data.logs || [];
      currentScore = data.currentScore || 100;
    }
  } catch(e) { scoreLogs = []; currentScore = 100; }
}

function saveDoiData() { localStorage.setItem(DOI_KEY, JSON.stringify(doiRecords)); }
function saveScoreData() { localStorage.setItem(SCORE_KEY, JSON.stringify({ logs: scoreLogs, currentScore })); }

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ============================================================
// Tab 切换
// ============================================================
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'doi') renderDoiAll();
  if (name === 'score') renderScoreAll();
}

// ============================================================
// DOI 日历
// ============================================================
function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('calMonthLabel').textContent = `${year}年${month+1}月`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevMonthLast = new Date(year, month, 0).getDate();

  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  ['日','一','二','三','四','五','六'].forEach(w => {
    const el = document.createElement('div');
    el.className = 'cal-weekday';
    el.textContent = w;
    grid.appendChild(el);
  });

  for (let i = startWeekday-1; i >= 0; i--) {
    const d = document.createElement('div');
    d.className = 'cal-day other';
    d.textContent = prevMonthLast - i;
    grid.appendChild(d);
  }

  const today = new Date();
  const todayKey = dateKey(today);

  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const key = dateKey(d);
    const el = document.createElement('div');
    el.className = 'cal-day';
    if (key === todayKey) el.classList.add('today');
    if (doiRecords[key]) {
      el.classList.add('has-doi');
      el.innerHTML = `<span class="day-emoji">💗</span>${day}<span class="day-badge">×${doiRecords[key].count}</span>`;
    } else {
      el.textContent = day;
    }
    el.onclick = () => openDoiModal(d);
    grid.appendChild(el);
  }

  const totalCells = startWeekday + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    const d = document.createElement('div');
    d.className = 'cal-day other';
    d.textContent = i;
    grid.appendChild(d);
  }
}

function changeMonth(delta) {
  currentMonth.setMonth(currentMonth.getMonth() + delta);
  renderCalendar();
}
function goToday() { currentMonth = new Date(); renderCalendar(); }

// ============================================================
// DOI 弹窗
// ============================================================
function openDoiModal(date) {
  editingDate = dateKey(date);
  document.getElementById('doiModalDate').textContent = `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`;
  const rec = doiRecords[editingDate];
  if (rec) {
    editingCount = rec.count;
    editingRating = rec.rating || 0;
    document.getElementById('doiNoteInput').value = rec.note || '';
    document.getElementById('doiDeleteBtn').style.display = '';
  } else {
    editingCount = 1;
    editingRating = 0;
    document.getElementById('doiNoteInput').value = '';
    document.getElementById('doiDeleteBtn').style.display = 'none';
  }
  updateDoiCountDisplay();
  updateRatingDisplay();
  document.getElementById('doiModalOverlay').classList.add('show');
}

function closeDoiModal(event) {
  if (event && event.target !== document.getElementById('doiModalOverlay')) return;
  document.getElementById('doiModalOverlay').classList.remove('show');
}

function changeDoiCount(delta) {
  editingCount = Math.max(1, editingCount + delta);
  updateDoiCountDisplay();
}
function updateDoiCountDisplay() { document.getElementById('doiCountDisplay').textContent = editingCount; }

function setRating(n) { editingRating = n; updateRatingDisplay(); }
function updateRatingDisplay() {
  const spans = document.getElementById('ratingGroup').children;
  for (let i = 0; i < spans.length; i++) spans[i].classList.toggle('active', i < editingRating);
}

function saveDoiRecord() {
  doiRecords[editingDate] = {
    count: editingCount,
    rating: editingRating,
    note: document.getElementById('doiNoteInput').value.trim()
  };
  saveDoiData();
  document.getElementById('doiModalOverlay').classList.remove('show');
  renderDoiAll();
}

function deleteDoiRecord() {
  if (!confirm('确定删除这条 DOI 记录吗？')) return;
  delete doiRecords[editingDate];
  saveDoiData();
  document.getElementById('doiModalOverlay').classList.remove('show');
  renderDoiAll();
}

// ============================================================
// DOI 统计
// ============================================================
function renderDoiStats() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();

  let monthCount = 0, monthDays = 0;
  Object.entries(doiRecords).forEach(([key, rec]) => {
    const [y, m] = key.split('-').map(Number);
    if (y === year && m === month+1) { monthCount += rec.count; monthDays++; }
  });
  const dayOfMonth = now.getDate();
  document.getElementById('statMonthCount').innerHTML = `${monthCount}<span class="unit">次</span>`;
  document.getElementById('statMonthExtra').textContent = `本月已过 ${dayOfMonth} 天 · ${monthDays} 天有记录`;

  let totalCount = 0, totalDays = 0;
  Object.values(doiRecords).forEach(rec => { totalCount += rec.count; totalDays++; });
  document.getElementById('statTotalCount').innerHTML = `${totalCount}<span class="unit">次</span>`;
  document.getElementById('statTotalExtra').textContent = `共 ${totalDays} 天有记录`;

  const streak = calcStreak();
  const maxStreak = calcMaxStreak();
  document.getElementById('statStreak').innerHTML = `${streak}<span class="unit">天</span>`;
  document.getElementById('statStreakExtra').textContent = `最长连续 ${maxStreak} 天`;

  let ratingSum = 0, ratingCount = 0;
  Object.values(doiRecords).forEach(rec => { if (rec.rating > 0) { ratingSum += rec.rating; ratingCount++; } });
  if (ratingCount > 0) {
    document.getElementById('statAvgRating').innerHTML = `${(ratingSum/ratingCount).toFixed(1)}<span class="unit">/5</span>`;
  } else {
    document.getElementById('statAvgRating').textContent = '—';
  }
  document.getElementById('statAvgExtra').textContent = `基于 ${ratingCount} 次评分`;
}

function calcStreak() {
  const today = new Date();
  let streak = 0;
  let d = new Date(today);
  if (!doiRecords[dateKey(d)]) d.setDate(d.getDate()-1);
  while (doiRecords[dateKey(d)]) { streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function calcMaxStreak() {
  const keys = Object.keys(doiRecords).sort();
  if (keys.length === 0) return 0;
  let max = 1, cur = 1;
  for (let i = 1; i < keys.length; i++) {
    const diff = (new Date(keys[i]) - new Date(keys[i-1])) / 86400000;
    if (diff === 1) { cur++; max = Math.max(max, cur); }
    else { cur = 1; }
  }
  return max;
}

// ============================================================
// DOI 图表
// ============================================================
function renderTrendChart() {
  const labels = [], data = [];
  const today = new Date();
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = dateKey(d);
    labels.push(`${d.getMonth()+1}/${d.getDate()}`);
    data.push(doiRecords[key] ? doiRecords[key].count : 0);
  }
  const ctx = document.getElementById('trendChart').getContext('2d');
  if (trendChart) trendChart.destroy();
  const gradient = ctx.createLinearGradient(0, 0, 0, 210);
  gradient.addColorStop(0, 'rgba(255,69,130,0.35)');
  gradient.addColorStop(1, 'rgba(255,69,130,0)');
  trendChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data,
        borderColor: '#ff4582',
        backgroundColor: gradient,
        fill: true,
        tension: 0.4,
        pointRadius: data.map(v => v>0?4:0),
        pointBackgroundColor: '#ffcc80',
        pointBorderColor: '#ff4582',
        pointBorderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor: '#12122a', borderColor: '#ff4582', borderWidth: 1, callbacks: { label: ctx => `${ctx.parsed.y} 次` } } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a6e8a', font: { size: 9 }, maxTicksLimit: 8 } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a6e8a', stepSize: 1 }, beginAtZero: true }
      }
    }
  });
}

function renderMonthCompare() {
  const container = document.getElementById('monthCompare');
  container.innerHTML = '';
  const now = new Date();
  const counts = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    let count = 0;
    Object.entries(doiRecords).forEach(([key, rec]) => {
      const [y, m] = key.split('-').map(Number);
      if (y === d.getFullYear() && m === d.getMonth()+1) count += rec.count;
    });
    counts.push({ count, d });
  }
  const maxCount = Math.max(1, ...counts.map(c => c.count));
  counts.forEach(({ count, d }) => {
    const bar = document.createElement('div');
    bar.className = 'month-bar';
    bar.innerHTML = `<div class="bar-count">${count}</div><div class="bar" style="height:${Math.max((count/maxCount)*100,3)}%"></div><div class="bar-label">${d.getMonth()+1}月</div>`;
    bar.onclick = () => { currentMonth = d; renderCalendar(); };
    container.appendChild(bar);
  });
}

function renderRecentList() {
  const list = document.getElementById('recentList');
  const sorted = Object.entries(doiRecords).sort((a,b) => b[0].localeCompare(a[0])).slice(0, 10);
  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty-state">还没有 DOI 记录<br>点击日历上的日期开始记录吧 ❤️‍🔥</div>';
    return;
  }
  const weekDays = ['日','一','二','三','四','五','六'];
  list.innerHTML = sorted.map(([key, rec]) => {
    const [y, m, d] = key.split('-').map(Number);
    const date = new Date(y, m-1, d);
    const rating = '❤️'.repeat(rec.rating || 0);
    return `<div class="recent-item" onclick="openDoiModal(new Date(${y},${m-1},${d}))"><div class="r-date">${m}月${d}日 周${weekDays[date.getDay()]}</div><div class="r-meta"><span>×${rec.count}</span>${rating?`<span class="r-rating">${rating}</span>`:''}${rec.note?`<span style="color:var(--text-muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${rec.note}</span>`:''}</div></div>`;
  }).join('');
}

// ============================================================
// 小本本分数
// ============================================================
function openScoreModal(mode) {
  scoreMode = mode;
  document.getElementById('scoreModalTitle').textContent = mode === 'add' ? '➕ 给男友加分' : '➖ 给男友减分';
  document.getElementById('scoreSign').textContent = mode === 'add' ? '+' : '−';
  document.getElementById('scoreValueInput').value = '5';
  document.getElementById('scoreReasonInput').value = '';
  document.getElementById('scoreModalOverlay').classList.add('show');
}

function closeScoreModal(event) {
  if (event && event.target !== document.getElementById('scoreModalOverlay')) return;
  document.getElementById('scoreModalOverlay').classList.remove('show');
}

function saveScore() {
  const points = parseInt(document.getElementById('scoreValueInput').value) || 0;
  const reason = document.getElementById('scoreReasonInput').value.trim();
  if (points <= 0) { alert('分值必须大于0'); return; }
  if (!reason) { alert('请填写加减分理由'); return; }

  const change = scoreMode === 'add' ? points : -points;
  currentScore += change;

  scoreLogs.push({
    date: dateKey(new Date()),
    time: new Date().toISOString(),
    type: scoreMode,
    points,
    reason
  });

  // 评分联动：如果当天有 DOI 记录且评分 ≥4，自动提示加分
  const todayKey = dateKey(new Date());
  const doiToday = doiRecords[todayKey];

  saveScoreData();
  document.getElementById('scoreModalOverlay').classList.remove('show');
  renderScoreAll();
}

function renderScoreBoard() {
  const numEl = document.getElementById('scoreBigNumber');
  numEl.textContent = currentScore;
  numEl.className = 'score-number';
  if (currentScore > 110) numEl.classList.add('high');
  else if (currentScore < 90) numEl.classList.add('low');
  else numEl.classList.add('mid');

  // 本月变化
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  let monthChange = 0;
  scoreLogs.forEach(log => {
    const [y, m] = log.date.split('-').map(Number);
    if (y === year && m === month) monthChange += log.type === 'add' ? log.points : -log.points;
  });

  const changeEl = document.getElementById('scoreMonthChange');
  if (monthChange > 0) {
    changeEl.innerHTML = `<span class="score-change up">↑ +${monthChange}</span>`;
  } else if (monthChange < 0) {
    changeEl.innerHTML = `<span class="score-change down">↓ ${monthChange}</span>`;
  } else {
    changeEl.textContent = '—';
  }
}

function renderScoreChart() {
  const labels = [], data = [];
  let runningScore = 100;
  const sorted = [...scoreLogs].sort((a,b) => new Date(a.time) - new Date(b.time));

  // 取最近60条
  const recent = sorted.slice(-60);
  if (recent.length === 0) {
    const today = new Date();
    labels.push(`${today.getMonth()+1}/${today.getDate()}`);
    data.push(100);
  } else {
    // 从初始分开始累积
    let score = 100;
    // 跳过显示之前的分数
    const allSorted = [...scoreLogs].sort((a,b) => new Date(a.time) - new Date(b.time));
    const startIdx = Math.max(0, allSorted.length - 60);
    for (let i = 0; i < startIdx; i++) {
      score += allSorted[i].type === 'add' ? allSorted[i].points : -allSorted[i].points;
    }
    for (let i = startIdx; i < allSorted.length; i++) {
      const log = allSorted[i];
      score += log.type === 'add' ? log.points : -log.points;
      const d = new Date(log.time);
      labels.push(`${d.getMonth()+1}/${d.getDate()}`);
      data.push(score);
    }
  }

  const ctx = document.getElementById('scoreChart').getContext('2d');
  if (scoreChart) scoreChart.destroy();

  const gradient = ctx.createLinearGradient(0, 0, 0, 170);
  gradient.addColorStop(0, 'rgba(94,234,219,0.3)');
  gradient.addColorStop(1, 'rgba(94,234,219,0)');

  const borderColor = currentScore >= 100 ? '#5eeadb' : '#ffb347';
  const pointColor = currentScore >= 100 ? '#5eeadb' : '#ff4d6a';

  scoreChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data,
        borderColor,
        backgroundColor: gradient,
        fill: true,
        tension: 0.3,
        pointRadius: 3,
        pointBackgroundColor: pointColor,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#12122a', borderColor: '#5eeadb', borderWidth: 1, callbacks: { label: ctx => `分数: ${ctx.parsed.y}` } },
        annotation: {
          annotations: {
            baseline: { type: 'line', yMin: 100, yMax: 100, borderColor: 'rgba(255,255,255,0.15)', borderWidth: 1, borderDash: [6,4] }
          }
        }
      },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a6e8a', font: { size: 9 }, maxTicksLimit: 8 } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a6e8a' } }
      }
    }
  });
}

function renderScoreLog() {
  const container = document.getElementById('scoreLog');
  const sorted = [...scoreLogs].sort((a,b) => new Date(b.time) - new Date(a.time));

  if (sorted.length === 0) {
    container.innerHTML = '<div class="empty-state">还没有分数变动记录<br>点击上方"加分"或"减分"按钮开始记录</div>';
    return;
  }

  container.innerHTML = sorted.map(log => {
    const [y, m, d] = log.date.split('-').map(Number);
    const sign = log.type === 'add' ? '+' : '−';
    const cls = log.type === 'add' ? 'add' : 'sub';
    const timeStr = `${m}月${d}日`;
    return `<div class="score-log-item">
      <div class="score-log-icon ${cls}">${sign}</div>
      <div class="score-log-info">
        <div class="score-log-reason">${log.reason}</div>
        <div class="score-log-date">${timeStr}</div>
      </div>
      <div class="score-log-points ${cls}">${sign}${log.points}</div>
    </div>`;
  }).join('');
}

// ============================================================
// 导入导出
// ============================================================
function exportData() {
  const data = {
    doiRecords,
    scoreLogs,
    currentScore,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workbench_backup_${dateKey(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (confirm('导入将合并到现有记录中，确定继续吗？')) {
        if (data.doiRecords) doiRecords = { ...doiRecords, ...data.doiRecords };
        if (data.scoreLogs) scoreLogs = [...scoreLogs, ...data.scoreLogs];
        if (data.currentScore !== undefined) currentScore = data.currentScore;
        saveDoiData();
        saveScoreData();
        renderAll();
        alert('导入成功！');
      }
    } catch(err) {
      alert('文件格式错误，导入失败');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============================================================
// 密码锁屏
// ============================================================
const PASSWORD_KEY = 'kwanho_lock_password';
let storedPass = localStorage.getItem(PASSWORD_KEY);
if (storedPass) {
  if (storedPass === '' || storedPass === 'null' || storedPass === 'undefined' || !/^\d{4,6}$/.test(storedPass)) {
    localStorage.removeItem(PASSWORD_KEY);
    storedPass = null;
  }
}
if (!storedPass) {
  storedPass = '123456';
  localStorage.setItem(PASSWORD_KEY, '123456');
}
let lockPassword = storedPass;
let inputBuffer = '';
let targetDigits = lockPassword.length;

(function initDots() {
  const row = document.getElementById('dotsRow');
  row.innerHTML = '';
  for (let i = 0; i < targetDigits; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    row.appendChild(dot);
  }
})();

function pressKey(digit) {
  if (inputBuffer.length >= targetDigits) return;
  inputBuffer += digit;
  updateDots();
  if (inputBuffer.length === targetDigits) {
    setTimeout(() => checkPassword(), 150);
  }
}

function pressDelete() {
  if (inputBuffer.length === 0) return;
  inputBuffer = inputBuffer.slice(0, -1);
  updateDots();
  // 清除错误状态
  document.querySelectorAll('.dot').forEach(d => d.classList.remove('error'));
  document.getElementById('lockMsg').textContent = '输入密码';
  document.getElementById('lockMsg').style.color = '';
}

function updateDots() {
  const dots = document.querySelectorAll('#dotsRow .dot');
  dots.forEach((d, i) => {
    d.classList.toggle('filled', i < inputBuffer.length);
    d.classList.remove('error');
  });
}

function checkPassword() {
  const dots = document.querySelectorAll('#dotsRow .dot');
  const msg = document.getElementById('lockMsg');

  if (inputBuffer !== lockPassword) {
    // 错误
    dots.forEach(d => { d.classList.add('error'); d.classList.remove('filled'); });
    msg.textContent = '密码错误';
    msg.style.color = 'var(--danger)';

    // 抖动标题
    const header = document.querySelector('.lock-header');
    header.style.animation = 'none';
    header.offsetHeight;
    header.style.animation = 'shake 0.5s ease';

    // 1秒后重置
    setTimeout(() => {
      inputBuffer = '';
      dots.forEach(d => { d.classList.remove('error', 'filled'); });
      msg.textContent = '输入密码';
      msg.style.color = '';
    }, 800);
    return;
  }

  // 正确
  msg.textContent = '✓';
  msg.style.color = 'var(--success)';
  setTimeout(() => {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = '';
    inputBuffer = '';
    loadData();
    renderAll();
  }, 300);
}

function unlock() { /* 数字键盘不需要手动提交 */ }

// 修改密码
function changePassword(newPass) {
  if (!newPass || newPass.length < 4) {
    alert('密码至少4位');
    return false;
  }
  if (newPass.length > 6) {
    alert('密码最多6位');
    return false;
  }
  if (!/^\d+$/.test(newPass)) {
    alert('密码只能是数字');
    return false;
  }
  lockPassword = newPass;
  targetDigits = newPass.length;
  localStorage.setItem(PASSWORD_KEY, newPass);
  return true;
}

// 动态添加改密按钮
setTimeout(() => {
  const actions = document.querySelector('.header-actions');
  if (actions) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-ghost';
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 改密`;
    btn.onclick = () => {
      const np = prompt('请输入新密码（4-6位数字）：');
      if (np) {
        if (changePassword(np)) {
          alert('密码修改成功！');
        }
      }
    };
    actions.insertBefore(btn, actions.firstChild);
  }
}, 500);
